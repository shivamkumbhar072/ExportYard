<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Search results -->
    <title>ExportYard | Source Quality Products from India</title>
    <meta
      name="description"
      content="Source products from India with ExportYard. Connect with Indian suppliers for spices, rice, minerals and more, with practical export and shipment coordination."
    />
    <meta name="theme-color" content="#183F35" />
    <link
      rel="preload"
      as="image"
      href="/Images/hero-port-optimized.webp"
      fetchpriority="high"
    />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" />
    <link rel="canonical" href="https://exportyard.com/" />

    <!-- Social previews (WhatsApp, LinkedIn, Facebook, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ExportYard" />
    <meta
      property="og:title"
      content="ExportYard | Source Quality Products from India"
    />
    <meta
      property="og:description"
      content="Connect with ExportYard to source quality products from India or introduce your products as a supplier."
    />
    <meta property="og:image" content="https://exportyard.com/Images/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: loaded here instead of a CSS @import so they don't block rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap"
    />

    <!-- Structured data: tells Google who the business is -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ExportYard",
        "url": "https://exportyard.com",
        "logo": "https://exportyard.com/Images/logo.png",
        "description": "ExportYard connects international buyers seeking products from India with suppliers looking for global trade opportunities.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Mumbai",
          "addressRegion": "Maharashtra",
          "addressCountry": "IN"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "contact@exportyard.com",
          "contactType": "sales"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Shown to crawlers and visitors with JavaScript turned off -->
    <noscript>
      <h1>ExportYard: India sourcing and export trade connections</h1>
      <p>
        ExportYard connects international buyers looking to source products
        from India with suppliers ready for global trade. Please enable
        JavaScript to use this site, or email contact@exportyard.com to make an
        enquiry.
      </p>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
