<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Search results -->
    <title>ExportYard | Export from Mumbai, India: Mineral Water Bottles and More</title>
    <meta
      name="description"
      content="ExportYard sources and exports products from Mumbai, India to ports worldwide, including packaged mineral water bottles. Tell us what you need and request an enquiry."
    />
    <meta name="theme-color" content="#0a1628" />

    <!-- Favicon -->
    <link rel="icon" href="/Images/small.png" />
    <link rel="apple-touch-icon" href="/Images/small.png" />

    <!-- Social previews (WhatsApp, LinkedIn, Facebook, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ExportYard" />
    <meta
      property="og:title"
      content="ExportYard | Export from Mumbai, India: Mineral Water Bottles and More"
    />
    <meta
      property="og:description"
      content="Products sourced and exported from Mumbai to ports worldwide, including mineral water bottles. Request an enquiry."
    />
    <meta property="og:image" content="https://exportyard.com/Images/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: loaded here instead of a CSS @import so they don't block rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap"
    />

    <!-- Structured data: tells Google who the business is -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ExportYard",
        "url": "https://exportyard.com",
        "logo": "https://exportyard.com/Images/logo.png",
        "description": "Exporter of products from Mumbai, India to ports worldwide, including packaged mineral water bottles.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Mumbai",
          "addressRegion": "Maharashtra",
          "addressCountry": "IN"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "contact@exportyard.com",
          "contactType": "sales"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Shown to crawlers and visitors with JavaScript turned off -->
    <noscript>
      <h1>ExportYard: exporter from Mumbai, India</h1>
      <p>
        ExportYard sources and exports products from Mumbai to ports around the
        world, including packaged mineral water bottles. Please enable
        JavaScript to use this site, or email contact@exportyard.com to make an
        enquiry.
      </p>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
